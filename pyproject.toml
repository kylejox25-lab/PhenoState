[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phenostate"
version = "0.1.0"
description = "PhenoState foundation model for six-channel Cell Painting images"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5,<2.6",
    "numpy>=1.24",
    "pyarrow>=14",
    "Pillow>=10",
    "mosaicml-streaming==0.13.0",
    "lightning>=2.5.6,<2.6",
    "torchsummary==1.5.1",
    "torchinfo>=1.8,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
analysis = [
    "pandas>=2.2,<3",
    "matplotlib>=3.8,<4",
    "scikit-learn>=1.4,<2",
    "nbformat>=5,<6",
    "jupyterlab>=4,<5",
]

[project.scripts]
phenostate-convert = "phenostate.data.convert:main"
phenostate-split = "phenostate.data.splits:main"
phenostate-check-loader = "phenostate.data.check_loader:main"
phenostate-train = "phenostate.train.mae:main"
phenostate-embed = "phenostate.infer:main"
phenostate-evaluate = "phenostate.evaluate:main"
phenostate-retrieval = "phenostate.retrieval:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
